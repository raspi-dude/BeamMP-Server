name: Release Create & Build

# A tag push publishes a release. workflow_dispatch does the same from the
# Actions tab, so a build can be published without touching git by hand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v3.5.0-rh1 (created at this commit if it does not exist)"
        required: true
        type: string

# create/upload release needs write access; the default token is often read-only.
permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_TYPE: "Release"
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  x86_64-matrix:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - distro: debian
            version: 12
          - distro: debian
            version: 13
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        shell: bash
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1-install-deps.sh

      - name: Create Build Environment
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Build Server
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build.sh

      # Rename before uploading: the release action takes the asset name from
      # the file name, and every matrix job builds a file called BeamMP-Server.
      - name: Stage release assets
        run: |
          cp ./bin/BeamMP-Server "BeamMP-Server-RaspiHost.${{ matrix.distro }}.${{ matrix.version }}.x86_64"
          cp ./bin/BeamMP-Server.debug "debuginfo.${{ matrix.distro }}.${{ matrix.version }}.x86_64"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Files included in this release are:
            - `BeamMP-Server-RaspiHost.<distro>.<version>.<arch>`, for example
              `BeamMP-Server-RaspiHost.debian.12.x86_64`. All require `liblua5.3`.
            - `debuginfo.<distro>.<version>.<arch>`, only needed to read a crash stack.
          files: |
            BeamMP-Server-RaspiHost.${{ matrix.distro }}.${{ matrix.version }}.x86_64
            debuginfo.${{ matrix.distro }}.${{ matrix.version }}.x86_64

  arm64-matrix:
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        include:
          - distro: debian
            version: 12
          - distro: debian
            version: 13
    env:
      VCPKG_DEFAULT_TRIPLET: "arm64-linux"
      VCPKG_FORCE_SYSTEM_BINARIES: 1
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    steps:
      - name: get-cmake
        uses: lukka/get-cmake@v3.28.1

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git
        run: |
          apt-get update -y
          apt-get install -y git

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Git config safe directory
        shell: bash
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1.5-git-safe.sh

      - name: Install Dependencies
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/1-install-deps.sh

      - name: Create Build Environment
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/2-configure.sh '-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Build Server
        run: bash ./scripts/${{ matrix.distro }}-${{ matrix.version }}/3-build.sh

      - name: Stage release assets
        run: |
          cp ./bin/BeamMP-Server "BeamMP-Server-RaspiHost.${{ matrix.distro }}.${{ matrix.version }}.arm64"
          cp ./bin/BeamMP-Server.debug "debuginfo.${{ matrix.distro }}.${{ matrix.version }}.arm64"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Files included in this release are:
            - `BeamMP-Server-RaspiHost.<distro>.<version>.<arch>`, for example
              `BeamMP-Server-RaspiHost.debian.12.x86_64`. All require `liblua5.3`.
            - `debuginfo.<distro>.<version>.<arch>`, only needed to read a crash stack.
          files: |
            BeamMP-Server-RaspiHost.${{ matrix.distro }}.${{ matrix.version }}.arm64
            debuginfo.${{ matrix.distro }}.${{ matrix.version }}.arm64
